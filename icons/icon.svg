<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="512" height="512" rx="120" fill="#f8f9fa"/>

  <!-- Book base -->
  <g id="book">
    <!-- Left page -->
    <path d="M 160 140 Q 160 120 180 120 L 256 120 L 256 360 Q 256 360 240 365 Q 220 370 200 360 Q 180 350 180 330 L 180 140 Q 180 135 160 140 Z"
          fill="#2563B5" stroke="#1e4a8a" stroke-width="2"/>

    <!-- Right page -->
    <path d="M 256 120 L 332 120 Q 352 120 352 140 L 352 330 Q 352 350 332 360 Q 312 370 292 365 Q 276 360 256 360 L 256 120 Z"
          fill="#3B75C4" stroke="#1e4a8a" stroke-width="2"/>

    <!-- Page details left -->
    <g opacity="0.3">
      <line x1="190" y1="160" x2="240" y2="160" stroke="#1e4a8a" stroke-width="3" stroke-linecap="round"/>
      <line x1="190" y1="180" x2="235" y2="180" stroke="#1e4a8a" stroke-width="3" stroke-linecap="round"/>
      <line x1="190" y1="200" x2="240" y2="200" stroke="#1e4a8a" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- Page details right -->
    <g opacity="0.3">
      <line x1="272" y1="160" x2="322" y2="160" stroke="#1e4a8a" stroke-width="3" stroke-linecap="round"/>
      <line x1="277" y1="180" x2="322" y2="180" stroke="#1e4a8a" stroke-width="3" stroke-linecap="round"/>
      <line x1="272" y1="200" x2="322" y2="200" stroke="#1e4a8a" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- Colorful bookmarks -->
    <rect x="200" y="90" width="20" height="50" rx="3" fill="#E85D75" opacity="0.9"/>
    <rect x="225" y="80" width="20" height="60" rx="3" fill="#5B9BD5" opacity="0.9"/>
    <rect x="250" y="85" width="20" height="55" rx="3" fill="#F4A5B8" opacity="0.9"/>
    <rect x="275" y="75" width="20" height="65" rx="3" fill="#6FA8DC" opacity="0.9"/>
    <rect x="300" y="90" width="20" height="50" rx="3" fill="#D84B6B" opacity="0.9"/>

    <!-- Spine -->
    <rect x="248" y="120" width="16" height="240" fill="#1e4a8a" opacity="0.8"/>
    <line x1="256" y1="120" x2="256" y2="360" stroke="white" stroke-width="1" opacity="0.3"/>
  </g>

  <!-- Arabic calligraphy stand - mimicking "مداد" -->
  <g id="stand">
    <!-- Main arch structure -->
    <path d="M 150 400 Q 150 360 180 360 L 200 360 L 200 380 Q 200 390 190 390 Q 180 390 180 400 L 150 400 Z"
          fill="#1a1a1a" stroke="#000" stroke-width="4"/>

    <path d="M 200 360 L 256 360 L 256 380 L 200 380 Z"
          fill="#1a1a1a"/>

    <path d="M 256 360 L 312 360 L 312 380 L 256 380 Z"
          fill="#1a1a1a"/>

    <path d="M 312 360 L 332 360 Q 362 360 362 400 L 332 400 Q 332 390 322 390 Q 312 390 312 380 L 312 360 Z"
          fill="#1a1a1a" stroke="#000" stroke-width="4"/>

    <!-- Inner decorative arch -->
    <path d="M 200 370 Q 200 385 215 385 Q 225 385 225 370 Z"
          fill="#f8f9fa" opacity="0.2"/>

    <path d="M 287 370 Q 287 385 302 385 Q 312 385 312 370 Z"
          fill="#f8f9fa" opacity="0.2"/>
  </g>

  <!-- Decorative accent dots -->
  <circle cx="380" cy="140" r="8" fill="#E85D75" opacity="0.6"/>
  <circle cx="420" cy="180" r="6" fill="#5B9BD5" opacity="0.6"/>
  <circle cx="130" cy="160" r="7" fill="#6FA8DC" opacity="0.6"/>
  <circle cx="100" cy="200" r="5" fill="#F4A5B8" opacity="0.6"/>
</svg>