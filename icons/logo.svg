<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="bookGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0066CC;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#004499;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="pagesGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#E63946;stop-opacity:1" />
      <stop offset="25%" style="stop-color:#F1F1F1;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0066CC;stop-opacity:1" />
      <stop offset="75%" style="stop-color:#F1F1F1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E63946;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- نصف الدائرة السفلية -->
  <circle cx="256" cy="320" r="140" fill="none" stroke="#1A1A2E" stroke-width="28" filter="url(#shadow)"/>

  <!-- الساق (العمود الأوسط) -->
  <rect x="236" y="240" width="40" height="95" fill="url(#bookGradient)" filter="url(#shadow)"/>

  <!-- الكتاب المفتوح -->
  <g filter="url(#shadow)">
    <!-- الصفحة اليسرى -->
    <path d="M 150 140 Q 140 160 140 200 L 140 280 Q 140 300 160 310 L 256 310 L 256 120 Q 230 120 150 140 Z" fill="url(#bookGradient)" opacity="0.8"/>

    <!-- الصفحة اليمنى -->
    <path d="M 362 140 Q 372 160 372 200 L 372 280 Q 372 300 352 310 L 256 310 L 256 120 Q 282 120 362 140 Z" fill="url(#bookGradient)"/>

    <!-- الصفحات الملونة العلوية -->
    <g>
      <!-- الشريط الأحمر -->
      <path d="M 180 110 Q 200 100 220 105 L 240 115 L 220 120 Q 200 118 180 125 Z" fill="#E63946"/>

      <!-- الشريط الأبيض -->
      <path d="M 240 110 Q 260 100 280 105 L 300 115 L 280 120 Q 260 118 240 125 Z" fill="#F1F1F1" stroke="#CCCCCC" stroke-width="1"/>

      <!-- الشريط الأزرق -->
      <path d="M 300 110 Q 320 100 340 105 L 360 115 L 340 120 Q 320 118 300 125 Z" fill="#0066CC"/>

      <!-- الجانب الآخر - الأحمر -->
      <path d="M 292 110 Q 272 100 252 105 L 232 115 L 252 120 Q 272 118 292 125 Z" fill="#D62828"/>

      <!-- الجانب الآخر - الأبيض -->
      <path d="M 232 110 Q 212 100 192 105 L 172 115 L 192 120 Q 212 118 232 125 Z" fill="#E8E8E8" stroke="#BBBBBB" stroke-width="1"/>

      <!-- الجانب الآخر - الأزرق -->
      <path d="M 172 110 Q 152 100 132 105 L 112 115 L 132 120 Q 152 118 172 125 Z" fill="#0052A3"/>
    </g>

    <!-- التفاصيل الدقيقة - خطوط الكتاب -->
    <line x1="256" y1="180" x2="256" y2="260" stroke="rgba(255,255,255,0.2)" stroke-width="2" stroke-linecap="round"/>

    <!-- الزوايا المستديرة -->
    <circle cx="310" cy="305" r="3" fill="rgba(255,255,255,0.4)"/>
    <circle cx="320" cy="308" r="2" fill="rgba(255,255,255,0.3)"/>
  </g>

  <!-- النص تحت اللوجو (اختياري) -->
  <text x="256" y="460" font-family="Arial, sans-serif" font-size="32" font-weight="700" text-anchor="middle" fill="#0066CC">مداد</text>
  <text x="256" y="490" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#666666">للمعرفة والتعلم</text>
</svg>